<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local File Agent</title>
<style>
  :root {
    --bg: #eef1f0; --panel: #ffffff; --ink: #16232b; --muted: #5d6d75;
    --line: #d4dcdb; --accent: #0f6b6b; --accent-ink: #ffffff;
    --warn: #b7791f; --warn-bg: #fdf4e3; --bad: #b3352b; --ok: #2f7a4d;
    --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181c; --panel: #182228; --ink: #e6edec; --muted: #8fa1a8;
      --line: #2a3a41; --accent: #3fb0a8; --accent-ink: #082220;
      --warn: #e0a84a; --warn-bg: #2b2415; --bad: #ef7d70; --ok: #6cc38d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  #status { color: var(--muted); font-size: 13px; flex: 1; }
  #status.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(720px, 92%); padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.error { align-self: flex-start; color: var(--bad); border: 1px solid var(--bad); background: var(--panel); }
  .msg.note { align-self: center; color: var(--muted); font-size: 13px; padding: 2px; }
  details.tool { align-self: flex-start; max-width: min(720px, 92%); font: 13px var(--mono); border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  details.tool.fail { border-color: var(--bad); }
  details.tool.pass { border-color: var(--ok); }
  details.tool summary { cursor: pointer; overflow-wrap: anywhere; }
  details.tool pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); max-height: 240px; overflow: auto; }
  form#composer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; resize: none; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-height: 140px; }
  #keybar { display: none; gap: 10px; padding: 12px 20px; background: var(--warn-bg); border-bottom: 1px solid var(--warn); align-items: center; }
  #keybar.show { display: flex; }
  #keybar input { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 14px var(--mono); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(560px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 16px; }
  dialog p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  dialog pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 12.5px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; margin: 4px 0 10px; }
  dialog label { display: block; font-size: 13px; margin-bottom: 4px; }
  dialog input[type=password] { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 14px; }
  #mem-text { width: 100%; min-height: 240px; resize: vertical; font: 13.5px/1.5 var(--mono); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
  <header>
    <h1>Local File Agent</h1>
    <span id="status">Starting…</span>
    <button id="memory-btn" type="button">Memory</button>
    <button id="reset" type="button">New chat</button>
  </header>

  <div id="keybar">
    <span>Groq API key needed:</span>
    <input id="key" type="password" placeholder="gsk_…" autocomplete="off">
    <button id="savekey" class="primary" type="button">Connect</button>
  </div>

  <main id="log" aria-live="polite"></main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask about your files, e.g. “List everything in my Downloads folder”" disabled></textarea>
    <button id="send" class="primary" type="submit" disabled>Send</button>
  </form>

  <dialog id="approval">
    <h2 id="ap-title"></h2>
    <p id="ap-sub"></p>
    <div id="ap-body"></div>
    <div id="ap-pw" hidden>
      <label for="ap-pass">Edit password</label>
      <input id="ap-pass" type="password" autocomplete="off">
    </div>
    <div class="actions">
      <button id="ap-deny" class="danger" type="button">Deny</button>
      <button id="ap-allow" class="primary" type="button">Allow</button>
    </div>
  </dialog>

  <dialog id="memory">
    <h2>Memory</h2>
    <p>Notes the agent reads before every message: folder locations, naming habits, preferences. Sent to Groq with your requests, so don't store passwords or keys here.</p>
    <textarea id="mem-text" spellcheck="false" placeholder="My projects live in D:\Projects&#10;Downloads is C:\Users\me\Downloads&#10;Name new files in lowercase-with-dashes"></textarea>
    <div class="actions">
      <button id="mem-cancel" type="button">Cancel</button>
      <button id="mem-save" class="primary" type="button">Save memory</button>
    </div>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
